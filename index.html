
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff1f5">
  <title>Doce Encanto | Receitas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <a class="logo" href="#">🍓 Doce Encanto</a>
    <p>Receitas para todos os momentos!</p>
  </header>

  <main>
    <section class="hero">
      <span class="hero-decor">🍰 ✨ 🍓</span>
      <h1>Um mundo de sabores!</h1>
      <p>Encontre sua próxima receita favorita.</p>
      <div class="contadores">
        <div><strong id="sweetCount">0</strong><span>Doces</span></div>
        <div><strong id="savoryCount">0</strong><span>Salgadas</span></div>
      </div>
    </section>

    <section class="filtros">
      <input id="searchInput" type="search"
        placeholder="🔎 Pesquisar uma receita...">

      <div class="botoes">
        <button class="filter active" data-type="all">Todas</button>
        <button class="filter" data-type="sweet">🍰 Doces</button>
        <button class="filter" data-type="savory">🍕 Salgadas</button>
      </div>
    </section>

    <div class="resultado">
      <h2 id="sectionTitle">Todas as receitas</h2>
      <span id="resultCount">Carregando receitas...</span>
    </div>

    <section id="recipeList" class="receitas">
      <div class="loading">Preparando o nosso livro de receitas... 🍳</div>
    </section>

    <section id="details" class="details" hidden></section>
  </main>

  <footer>
    <h2>🍓 Doce Encanto</h2>
    <p>Feito com carinho e muitas receitas!</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
