
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffdce9">
  <title>Doce Encanto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <a class="logo" href="#">🍰 Doce Encanto</a>
    <p>Receitas feitas com carinho e açúcar!</p>
  </header>

  <main>
    <section class="banner">
      <div class="banner-desenho">🧁 🍓 ✨</div>
      <h1>Um mundo cheio de doces encantos!</h1>
      <p>Descubra receitas deliciosas e prepare sua sobremesa favorita.</p>
    </section>

    <section class="busca">
      <input id="searchInput" type="search"
        placeholder="🔎 Pesquise uma receita..."
        aria-label="Pesquisar receitas">
    </section>

    <nav class="categorias" id="categories">
      <button class="ativo" data-category="Todas">Todas</button>
      <button data-category="Bolos">Bolos</button>
      <button data-category="Docinhos">Docinhos</button>
      <button data-category="Sobremesas">Sobremesas</button>
      <button data-category="Mousses">Mousses</button>
      <button data-category="Tortas">Tortas</button>
      <button data-category="Biscoitos">Biscoitos</button>
    </nav>

    <p id="resultCount" class="contador"></p>
    <section id="recipeList" class="receitas"></section>
    <section id="details" class="details" hidden></section>
  </main>

  <footer>
    <p>Feito com carinho 💗 Doce Encanto © 2026</p>
    <div>🍓 🧁 🍪 🍒</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
