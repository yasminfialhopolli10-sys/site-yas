
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo com 200 receitas doces e 200 receitas salgadas.">
  <title>Doce Encanto — 400 receitas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header class="hero">
    <div class="brand">Doce Encanto</div>
    <p>Receitas para todos os momentos e sabores.</p>

    <div class="stats">
      <span><b id="sweetCount">0</b> doces</span>
      <span><b id="savoryCount">0</b> salgadas</span>
      <span><b id="allCount">0</b> no total</span>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <label class="sr-only" for="search">Pesquisar receita</label>
      <input id="search" type="search" placeholder="Pesquisar pelo nome da receita...">

      <div class="filters">
        <button class="filter active" data-filter="all" type="button">Todas</button>
        <button class="filter" data-filter="doce" type="button">Doces</button>
        <button class="filter" data-filter="salgada" type="button">Salgadas</button>
      </div>

      <p id="resultCount" aria-live="polite"></p>
    </section>

    <section id="recipeGrid" class="recipe-grid" aria-label="Receitas"></section>
    <p id="emptyMessage" class="empty" hidden>Nenhuma receita encontrada. Tente outro termo.</p>
  </main>

  <div id="recipeDialog" class="dialog" aria-hidden="true">
    <section class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <button id="closeDialog" class="close" type="button" aria-label="Fechar">×</button>
      <div id="recipeDetails"></div>
    </section>
  </div>

  <footer>Doce Encanto • 200 receitas doces e 200 receitas salgadas</footer>
</body>
</html>
